<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Inspired UI</title>
    <link rel="stylesheet" href="../static/css/utilities.css">
    <link rel="stylesheet" href="../static/css/steamui.css">
</head>

<body>
    <!--NAVBAR-->
    <nav class="navbar">
         <!--All the navigation bar must go inside a navbar-container-->
        <div class="navbar-container">
            <div class="navbar-toggler">
                <!--This is the label for the 3 lines: the image that appears to the far left when the image is lower than 720px-->
                <label for="navToggle" class="navbar-toggler-icon"></label>
            </div>
            <!--This is the image that will be used as the logo of the page. It should send you back to the starting page-->
            <div class="navbar-logo">
                <a href="https://store.steampowered.com/?snr=1_5_9__global-header">
                    <img src="https://store.akamai.steamstatic.com/public/shared/images/header/logo_steam.svg?t=962016"
                        width="176" height="44">
                </a>
            </div>
            <!--With this input, we begin asigning the items-->
            <input type="checkbox" id="navToggle">
            <ul class="navbar-nav">
                <div class="navbar-toggler">
                    <label for="navToggle" class="navbar-toggler-icon"></label>  <!--This corresponds to the X: the image that appears in case of having a screen with width of 720 or less and we select the 3 lines-->
                </div>
                <!--This is for each item that we want to add WITH a dropdown-->
                <li class="navbar-item active"> <!--VERY IMPORTANT: the active item should be the one where we are in the moment. The rest must be only navbar-items.-->
                    <a class="navbar-link" href="#">Shop</a> 
                    <!--For each element that has to appear in the dropdown-->
                    <div class="navbar-dropdown">
                        <a href="#" class="dropdown-link">Test</a>
                        <a href="#" class="dropdown-link">Test</a>
                        <a href="#" class="dropdown-link">Test</a>
                        <a href="#" class="dropdown-link">Test</a>
                    </div>
                </li>
                <!--This is for each item that we want to add WITHOUT a dropdown-->
                <li class="navbar-item">
                    <a class="navbar-link" href="#">Chat</a>
                </li>
            </ul>
        </div>
    </nav>
    
    <div class="page-container">
        <div class="banner mb-40">
            <a href="#">
                <img src="https://placehold.co/910x125" alt="banner img">
            </a>
            <a href="#">
                <img src="https://placehold.co/970x125" alt="banner img">
            </a>
        </div>
    </div>
    <h2>Banner</h2>
        <div class="banner mb-40">
            <a href="#">
                <img src="https://placehold.co/970x125" alt="banner img">
            </a>
        </div>


        
    

</body>

</html>

<!--Notes:-->
<!--Every page should go inside a page container. if needbe, a new container with bigger max-width can be created in case of the 
width being too short-->
<!--the mb-40 is telling what the margin bottom will be. Can be found in the utilities css.-->
