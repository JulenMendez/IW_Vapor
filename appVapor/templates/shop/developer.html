{% extends 'shop/base_shop.html' %}

{% load static %}

{% block title %}---{% endblock title%} <!--Poner de título el nombre del juego-->

{%block pageBody%}
<h2>{{developer.name}}</h2>
        <div class="mb-40"> 
            <a> 
                <img src={%static "/images/Devs/{{developer.get_image_name}}"%} alt="banner img" class="categoryAndDeveloperImage">
            </a>
        </div>
        <h3 class="description">{{developer.description}}</h3>
        <div class="categoryContainer">
            <div class="banner banner-grid mb-40">            
                <a href="#">
                    <img src={%static "/images/HorizontalCover/games_list[0]"%} alt="banner img" class="categorySmallImg">
                </a>
                <a href="#">
                    <img src={%static "/images/HorizontalCover/games_list[1]"%} alt="banner img" class="categoryBigImg">
                </a>
                <a href="#">
                    <img src={%static "/images/HorizontalCover/games_list[2]"%} alt="banner img" class="categorySmallImg">
                </a>
            </div>
        </div>
            <!--Igual que en category.html: al ultimo banner banner-grid ponerle mb-40 para que haya hueco abajo-->    
             <!--Para Julen-->
            <!--Es una plantilla de buscar juegos de developer. Tantos juegos como tenga el developer--> 
            <!--En el banner debe estar la foto de banner del developer. Esto es, habra una foto del tamaño del de la plantilla que habra que poner ahi-->
            <!--En el titulo debe estar el nombre del developer-->  
            <!--En la descripcion hacer como con el titulo, el que le corresponda--> 
            <!--En las imagenes. Si hay 3 juegos en el developer, pues habra 3 imagenes. En caso de que un developer tenga 3 o mas juegos,
                poner 3 juegos por linea hasta que llegue al numero total de los juegos del developer. Sino, poner los que haya para rellenar-->
    </div>{%endblock pageBody%}
