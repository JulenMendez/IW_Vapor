{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/utilities.css' %}">
    <link rel="stylesheet" href="{% static 'css/steamui.css' %}">
    
    <title>{% block title %}Default title{% endblock title%}</title>
</head>

<body>
 <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-toggler">
                <label for="navToggle" class="navbar-toggler-icon"></label>
            </div>
            <div class="navbar-logo">
                <a href="https://store.steampowered.com/?snr=1_5_9__global-header">
                    <img src={%static "images/steam_logo.png"%}
                        alt="logo" id="logo_img">
                </a>
            </div>
            <input type="checkbox" id="navToggle">
            <ul class="navbar-nav">
                <li class="navbar-toggler">
                    <label for="navToggle" class="navbar-toggler-icon"></label>  <!--This corresponds to the X: the image that appears in case of having a screen with width of 720 or less and we select the 3 lines-->
                </li>
                <li {%block shopNavBar%}class="navbar-item active"{%endblock shopNavBar%}> <!--VERY IMPORTANT: the active item should be the one where we are in the moment. The rest must be only navbar-items.-->
                    <a class="navbar-link" href="{% url "index"%}">Shop</a> 
                </li>
            </ul>
        </div>
    </nav>

    {%block pageContent%}
        
    {%endblock pageContent%}

</body>
</html>
